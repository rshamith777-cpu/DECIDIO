<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio — Creative Reference Footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'DM Sans Local';
      src: url('https://cdn.prod.website-files.com/683703490bc01e1b8c052e06/68370ddd1dd328d7914d6512_DMSans-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Epilogue Local';
      src: url('https://cdn.prod.website-files.com/683703490bc01e1b8c052e06/68370ddd06d737200122a835_Epilogue-Black.woff2') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --background: #dfe4f2;
      --foreground: #080909;
      font-family: 'DM Sans Local', 'DM Sans', Arial, sans-serif;
      font-weight: 400;
      color: var(--foreground);
      background: var(--background);
      font-synthesis: none;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .footer {
      position: relative;
      min-height: 100vh;
      padding-top: 6.54vw;
      isolation: isolate;
      overflow: hidden;
    }
    .footer-background {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }
    .footer-background video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .jobs {
      margin-left: 8.65vw;
      width: 25vw;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 100px;
      background: #f7f8fa;
      padding: .39vw .61vw;
      font-size: .88vw;
      line-height: 1.2;
      height: 1.9vw;
      white-space: nowrap;
    }
    .headline {
      font-family: 'Epilogue Local', 'Epilogue', Arial, sans-serif;
      font-weight: 900;
      font-size: 1.66vw;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .job-title {
      display: block;
      margin-top: 1.45vw;
    }
    .footer-nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .93vw;
      margin-top: 1.3vw;
      font-size: 1.075vw;
      line-height: 1.35;
    }
    .logo {
      position: absolute;
      left: 40.33vw;
      top: 7.7vw;
      width: 17vw;
    }
    .logo svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .contact {
      position: absolute;
      left: 74.3vw;
      top: 6.54vw;
    }
    .contact-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 1.45vw;
      white-space: nowrap;
    }
    .note {
      margin: 1.05vw 0 0;
      font-size: .733vw;
      line-height: 1.4;
      white-space: nowrap;
    }
    .socials {
      display: flex;
      align-items: center;
      gap: 1.43vw;
      margin-top: 1.61vw;
    }
    .socials span, .socials svg {
      display: block;
      width: 1.71vw;
      height: 1.71vw;
    }

    @media (max-width: 700px) {
      :root {
        --background: #f0eefa;
        background: var(--background);
      }
      body {
        background: var(--background);
      }
      .footer {
        display: flex;
        flex-direction: column;
        gap: 36px;
        min-height: 100svh;
        padding: 40px 24px 0;
        background: var(--background);
      }
      .logo {
        position: static;
        order: 0;
        align-self: flex-start;
        width: 210px;
        max-width: 75%;
        margin-bottom: 4px;
      }
      .jobs {
        order: 1;
        margin: 0;
        width: 100%;
      }
      .tag {
        height: 30px;
        padding: 6px 11px;
        font-size: 14px;
      }
      .headline {
        font-size: clamp(22px, 6.3vw, 30px);
        line-height: 1.25;
      }
      .job-title, .contact-links {
        margin-top: 19px;
      }
      .footer-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 24px;
        margin-top: 20px;
        font-size: 17px;
        line-height: 1.4;
      }
      .footer-nav span {
        display: flex;
        align-items: center;
        min-height: 44px;
      }
      .contact {
        position: static;
        order: 2;
        width: 100%;
      }
      .contact-links {
        gap: 4px;
        white-space: normal;
      }
      .note {
        max-width: 34ch;
        margin: 16px 0 0;
        font-size: 14px;
        line-height: 1.5;
        white-space: normal;
      }
      .socials {
        gap: 18px;
        margin-top: 20px;
      }
      .socials span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
      }
      .socials svg {
        width: 30px;
        height: 30px;
      }
      .socials span:first-child {
        margin-left: -7px;
      }
      .footer-background {
        position: relative;
        inset: auto;
        order: 3;
        z-index: auto;
        flex: none;
        align-self: center;
        width: calc(100% + 48px);
        aspect-ratio: 4/3;
        margin-top: -16px;
      }
      .footer-background video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
    }
  </style>
</head>

    const gazeFrames = [

      [4.833089, 1.79167], [4.894145, 1.83333], [4.962593, 1.875], [5.028737, 1.91667],
      [5.090028, 1.95833], [5.212041, 2.0], [5.28302, 2.04167], [5.349352, 2.08333],

    ];

    const TAU = Math.PI * 2;
    const wrappedAngle = (angle) => (angle % TAU + TAU) % TAU;

    function timeForAngle(angle) {
      const target = wrappedAngle(angle);
      let nearestTime = gazeFrames[0][1];
      let nearestDistance = Infinity;
      for (const [sampleAngle, time] of gazeFrames) {
        const difference = Math.abs(target - sampleAngle);
        const distance = Math.min(difference, TAU - difference);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestTime = time;
        }
      }
      return nearestTime + 1 / 240;
    }

    const video = document.getElementById('bgVideo');
    let frame = 0;
    let desiredTime = 0;
    let pointer = null;
    const mobile = window.matchMedia('(max-width: 700px)');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const seek = () => {
      frame = 0;
      if (mobile.matches || video.readyState < 2 || video.seeking) return;
      if (Math.abs(video.currentTime - desiredTime) > 1 / 48) {
        video.currentTime = Math.min(desiredTime, (video.duration || 7.04) - 1 / 24);
      }
    };

    const schedule = () => {
      if (!frame) frame = requestAnimationFrame(seek);
    };

    const updateTarget = () => {
      if (mobile.matches || !pointer) return;
      const rect = video.getBoundingClientRect();
      const scale = Math.max(rect.width / 1920, rect.height / 1080);
      const eyeX = rect.left + rect.width / 2 + (948 - 960) * scale;
      const eyeY = rect.top + rect.height / 2 + (418 - 540) * scale;
      const dx = pointer.x - eyeX;
      const dy = pointer.y - eyeY;
      if (Math.hypot(dx, dy) > 8) {
        desiredTime = timeForAngle(Math.atan2(dy, dx));
        schedule();
      }
    };

    window.addEventListener('pointermove', (e) => {
      pointer = { x: e.clientX, y: e.clientY };
      updateTarget();
    }, { passive: true });

    const setup = () => {
      video.loop = mobile.matches;
      if (mobile.matches && !reducedMotion.matches) {
        video.play().catch(() => {});
      } else {
        video.pause();
        if (!mobile.matches) { updateTarget(); schedule(); }
      }
    };

    video.addEventListener('seeked', schedule);
    video.addEventListener('loadeddata', setup);
    window.addEventListener('resize', updateTarget);
    if (video.readyState >= 2) setup();
  </script>
</body>
</html>
